[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sylva-memory"
version = "0.1.0"
description = "Ultra-lean agent memory engine with SQLite WAL and tree-ring consolidation."
readme = "README.md"
authors = [
    { name = "Daey886" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlite-vec>=0.1.3; python_version>='3.10'",
    "fastembed>=0.2.7",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "semgrep>=1.60.0",
    "ruff>=0.3.0",
]

[project.scripts]
sylva = "sylva.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
